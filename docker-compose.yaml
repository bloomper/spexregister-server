name: fgv-spexregister-server

services:
  spexregister-mysql:
    image: 'mysql:8.4'
    restart: unless-stopped
    command: --log-error=/var/log/mysql/error.log
    environment:
      MYSQL_HOST: localhost
      MYSQL_DATABASE: ${FGV_SPEXREGISTER_MYSQL_DATABASE}
      MYSQL_ROOT_USER: ${FGV_SPEXREGISTER_MYSQL_ROOT_USER}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/FGV_SPEXREGISTER_MYSQL_ROOT_PASSWORD
      MYSQL_USER: ${FGV_SPEXREGISTER_MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/FGV_SPEXREGISTER_MYSQL_USER_PASSWORD
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      org.springframework.boot.ignore: true
    #ports:
    #  - "3306:3306"
    volumes:
      - fgv_spexregister_mysql_data:/var/lib/mysql
      - fgv_spexregister_mysql_log:/var/log/mysql
    secrets:
      - FGV_SPEXREGISTER_MYSQL_ROOT_PASSWORD
      - FGV_SPEXREGISTER_MYSQL_USER_PASSWORD

  spexregister-api:
    image: 'bloomper/spexregister-server:develop'
    #platform: linux/arm64
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://spexregister-mysql/${FGV_SPEXREGISTER_MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${FGV_SPEXREGISTER_MYSQL_USER}
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_BACKEND_DIRECTORY_ROOT: /data/index_data
      LOGGING_FILE_PATH: /data/log_data
      SERVER_REQUEST_HEADER_FORWARDED_STRATEGY: web-server
      API_BASE_URL: https://api.register.fgv.local.nu:8443/api
      API_KEYCLOAK_URL: http://keycloak-server:8080/auth
      API_KEYCLOAK_REALM: ${API_KEYCLOAK_REALM}
      API_KEYCLOAK_ADMIN_CLIENT_ID: ${API_KEYCLOAK_ADMIN_CLIENT_ID}
      API_KEYCLOAK_CLIENT_CLIENT_ID: ${API_KEYCLOAK_CLIENT_CLIENT_ID}
      API_SEED_AUDIT_DATA: ${API_SEED_AUDIT_DATA:-false}
      API_IMPORT_SAMPLE_DATA: ${API_IMPORT_SAMPLE_DATA:-false}
      API_SPEXIPEDIA_GRAPHQL_URL: http://spexipedia-api:8080/api/graphql
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      MAIL_FROM: noreply@fgv.local.nu
      ADMIN_NOTIFICATION_RECIPIENTS: admin@fgv.local.nu
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak-server:8080/auth/realms/fgv/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.fgv.local.nu:8443/auth/realms/fgv
      API_SECURITY_AUTHORIZED_PARTIES: fgv-spexregister,fgv-revival-service,fgv-spexify-service,fgv-spexflix-service,fgv-spexgram-service,fgv-archive-service,fgv-spexipedia-service
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000;printf \"GET /actuator/health HTTP/1.1\r\nhost: api.register.fgv.local.nu\r\nConnection: close\r\n\r\n\" >&3;grep -q \"^HTTP/1.1 200\" <&3" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      spexregister-mysql:
        condition: service_healthy
    volumes:
      - fgv_spexregister_api_log:/data/log_data
      - fgv_spexregister_api_index:/data/index_data
      - fgv_spexregister_api_impex:/data/impex_data
    networks:
      - default
      - fgv
    secrets:
      - source: FGV_SPEXREGISTER_MYSQL_USER_PASSWORD
        target: MYSQL_API_USER_PASSWORD
      - API_KEYCLOAK_ADMIN_CLIENT_SECRET
      - API_KEYCLOAK_SERVICE_CLIENT_SECRET
      - API_SECRET_KEY

volumes:
  fgv_spexregister_mysql_data:
    driver: local
    driver_opts:
      type: none
      device: .docker/fgv-spexregister-mysql/data
      o: bind
  fgv_spexregister_mysql_log:
    driver: local
    driver_opts:
      type: none
      device: .docker/fgv-spexregister-mysql/log
      o: bind
  fgv_spexregister_api_log:
    driver: local
    driver_opts:
      type: none
      device: .docker/fgv-spexregister-api/log_data
      o: bind
  fgv_spexregister_api_index:
    driver: local
    driver_opts:
      type: none
      device: .docker/fgv-spexregister-api/index_data
      o: bind
  fgv_spexregister_api_impex:
    driver: local
    driver_opts:
      type: none
      device: .docker/fgv-spexregister-api/impex_data
      o: bind

networks:
  fgv:
    name: fgv-local
    external: true

secrets:
  FGV_SPEXREGISTER_MYSQL_ROOT_PASSWORD:
    file: .docker/secrets/FGV_SPEXREGISTER_MYSQL_ROOT_PASSWORD
  FGV_SPEXREGISTER_MYSQL_USER_PASSWORD:
    file: .docker/secrets/FGV_SPEXREGISTER_MYSQL_USER_PASSWORD
  API_KEYCLOAK_ADMIN_CLIENT_SECRET:
    file: .docker/secrets/API_KEYCLOAK_ADMIN_CLIENT_SECRET
  API_KEYCLOAK_SERVICE_CLIENT_SECRET:
    file: .docker/secrets/API_KEYCLOAK_SERVICE_CLIENT_SECRET
  API_SECRET_KEY:
    file: .docker/secrets/API_SECRET_KEY
