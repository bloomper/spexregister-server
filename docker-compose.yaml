name: spexregister-server

services:
  spexregister-mysql:
    image: 'mysql:8.4'
    command: --log-error=/var/log/mysql/error.log
    environment:
      MYSQL_HOST: localhost
      MYSQL_DATABASE: ${SPEXREGISTER_MYSQL_DATABASE}
      MYSQL_ROOT_USER: ${SPEXREGISTER_MYSQL_ROOT_USER}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/SPEXREGISTER_MYSQL_ROOT_PASSWORD
      MYSQL_USER: ${SPEXREGISTER_MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/SPEXREGISTER_MYSQL_USER_PASSWORD
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      org.springframework.boot.ignore: true
    #ports:
    #  - "3306:3306"
    volumes:
      - spexregister_mysql_data:/var/lib/mysql
      - spexregister_mysql_log:/var/log/mysql
    secrets:
      - SPEXREGISTER_MYSQL_ROOT_PASSWORD
      - SPEXREGISTER_MYSQL_USER_PASSWORD

  spexregister-api:
    image: 'bloomper/spexregister-server:develop'
    #platform: linux/arm64
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://spexregister-mysql/${SPEXREGISTER_MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPEXREGISTER_MYSQL_USER}
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_BACKEND_DIRECTORY_ROOT: /data/index_data
      LOGGING_FILE_PATH: /data/log_data
      SERVER_FORWARD_HEADERS_STRATEGY: native
      API_BASE_URL: https://api.register.fgv.local.nu:8443/api
      API_KEYCLOAK_URL: http://keycloak-server:8080/auth
      API_KEYCLOAK_REALM: ${API_KEYCLOAK_REALM}
      API_KEYCLOAK_ADMIN_CLIENT_ID: ${API_KEYCLOAK_ADMIN_CLIENT_ID}
      API_KEYCLOAK_CLIENT_CLIENT_ID: ${API_KEYCLOAK_CLIENT_CLIENT_ID}
      API_SEED_AUDIT_DATA: ${API_SEED_AUDIT_DATA}
      API_IMPORT_SAMPLE_DATA: ${API_IMPORT_SAMPLE_DATA}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      MAIL_FROM: noreply@fgv.local.nu
      ADMIN_NOTIFICATION_RECIPIENTS: admin@fgv.local.nu
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak-server:8080/auth/realms/fgv/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.fgv.local.nu:8443/auth/realms/fgv
    restart: on-failure
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000;printf \"GET /actuator/health HTTP/1.1\r\nhost: api.register.fgv.local.nu\r\nConnection: close\r\n\r\n\" >&3;grep -q \"^HTTP/1.1 200\" <&3" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      spexregister-mysql:
        condition: service_healthy
    volumes:
      - spexregister_api_log:/data/log_data
      - spexregister_api_index:/data/index_data
      - spexregister_api_impex:/data/impex_data
    networks:
      - default
      - fgv
    secrets:
      - source: SPEXREGISTER_MYSQL_USER_PASSWORD
        target: MYSQL_API_USER_PASSWORD
      - API_KEYCLOAK_ADMIN_CLIENT_SECRET
      - API_SECRET_KEY

volumes:
  spexregister_mysql_data:
    driver: local
    driver_opts:
      type: none
      device: .docker/spexregister-mysql/data
      o: bind
  spexregister_mysql_log:
    driver: local
    driver_opts:
      type: none
      device: .docker/spexregister-mysql/log
      o: bind
  spexregister_api_log:
    driver: local
    driver_opts:
      type: none
      device: .docker/spexregister-api/log_data
      o: bind
  spexregister_api_index:
    driver: local
    driver_opts:
      type: none
      device: .docker/spexregister-api/index_data
      o: bind
  spexregister_api_impex:
    driver: local
    driver_opts:
      type: none
      device: .docker/spexregister-api/impex_data
      o: bind

networks:
  fgv:
    name: fgv-local
    external: true

secrets:
  SPEXREGISTER_MYSQL_ROOT_PASSWORD:
    file: .docker/secrets/SPEXREGISTER_MYSQL_ROOT_PASSWORD
  SPEXREGISTER_MYSQL_USER_PASSWORD:
    file: .docker/secrets/SPEXREGISTER_MYSQL_USER_PASSWORD
  API_KEYCLOAK_ADMIN_CLIENT_SECRET:
    file: .docker/secrets/API_KEYCLOAK_ADMIN_CLIENT_SECRET
  API_SECRET_KEY:
    file: .docker/secrets/API_SECRET_KEY
