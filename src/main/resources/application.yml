spring:
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    password: ${MYSQL_APP_USER_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      jakarta:
        persistence:
          sharedCache:
            mode: UNSPECIFIED
      hibernate:
        transaction:
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
        search:
          backend:
            type: lucene
            lucene_version: LATEST
            directory:
              type: local-filesystem
              root: ./data/index_data
            analysis:
              configurer: class:nu.fgv.register.server.util.search.DefaultOverridingLuceneAnalysisConfigurer
          schema_management:
            strategy: create-or-update
          indexing:
            listeners:
              enabled: true
      org.hibernate.envers.audit_table_suffix: _audit
      org.hibernate.envers.audit_strategy: org.hibernate.envers.strategy.internal.ValidityAuditStrategy
      org.hibernate.envers.audit_strategy_validity_store_revend_timestamp: true
      org.hibernate.envers.track_entities_changed_in_revision: true
      org.hibernate.envers.store_data_at_delete: true
  servlet:
    multipart:
      max-file-size: 15MB
  task:
    scheduling:
      pool:
        size: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${APP_KEYCLOAK_URL}/realms/${APP_KEYCLOAK_REALM}
  threads:
    virtual:
      enabled: true
  graphql:
    schema:
      printer:
        enabled: true
    http:
      path: /api/graphql
    websocket:
      path: /api/graphql
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  ai:
    model:
      embedding: ollama
    ollama:
      base-url: ${APP_OLLAMA_URL}
      embedding:
        model: nomic-embed-text

management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,metrics,info

server:
  port: 8080

logging:
  file:
    path: ./data/log_data

spexregister:
  base-url: ${APP_BASE_URL}
  default-language: sv
  languages:
    - en
    - sv
  crypto:
    secret-key: ${APP_SECRET_KEY}
    initialization-vector: ${APP_IV}
    algorithm: "AES/CFB/PKCS5Padding"
  jobs:
    search-full-index:
      cron-expression: 0 0 */4 * * ? # Every 4 hours
    semantic-search-full-index:
      cron-expression: 0 0 */6 * * ? # Every 6 hours
    publish-unpublish-news:
      cron-expression: 5 0 0 * * ? # Every night at 00:00:05
    sync-users:
      cron-expression: 0 30 * * * ? # Every hour
    job-cleanup:
      cron-expression: 0 0 3 * * ? # Every day at 03:00
      purge-threshold-in-days: 7
  keycloak:
    url: ${APP_KEYCLOAK_URL}
    realm: ${APP_KEYCLOAK_REALM}
    admin:
      client-id: ${APP_KEYCLOAK_ADMIN_CLIENT_ID}
      client-secret: ${APP_KEYCLOAK_ADMIN_CLIENT_SECRET}
    client:
      client-id: ${APP_KEYCLOAK_CLIENT_CLIENT_ID}
      client-secret: ${APP_KEYCLOAK_CLIENT_CLIENT_SECRET}
  impex:
    storage-path: ./data/impex_data
  data:
    seed-audit-data: ${APP_SEED_AUDIT_DATA}
    import-sample-data: ${APP_IMPORT_SAMPLE_DATA}
  semantic-search:
    qdrant:
      base-url: ${APP_QDRANT_URL}
      collection: spexare
      distance: Cosine
      doWait: true
    embedding:
      batch-size: 32
      page-size: 200
      semantic-candidate-limit-for-facets: 2000
