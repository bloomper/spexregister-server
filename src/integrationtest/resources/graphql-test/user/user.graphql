query user ($id: ID!) {
    user (id: $id) {
        id
        email
        authorities {
            id
            label
            createdBy
            createdAt
            lastModifiedBy
            lastModifiedAt
        }
        state {
            id
            label
            createdBy
            createdAt
            lastModifiedBy
            lastModifiedAt
        }
        spexare {
            id
        }
        createdBy
        createdAt
        lastModifiedBy
        lastModifiedAt
    }
}
