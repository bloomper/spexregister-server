query consentPaged ($spexareId: ID!, $first: Int = 10) {
    consentPaged (spexareId: $spexareId, first: $first) {
        edges {
            cursor
            node {
                id
                value
                type {
                    id
                    label
                    type
                }
                createdBy
                createdAt
                lastModifiedBy
                lastModifiedAt
            }
        }
        pageInfo {
            hasPreviousPage
            hasNextPage
            startCursor
            endCursor
        }
    }
}
