query taskActivity ($spexareId: ID!, $activityId: ID!, $id: ID!, $first: Int = 10) {
    taskActivity (spexareId: $spexareId, activityId: $activityId, id: $id) {
        id
        task {
            id
            name
            category {
                id
                name
                actorPresent
                createdBy
                createdAt
                lastModifiedBy
                lastModifiedAt
            }
            createdBy
            createdAt
            lastModifiedBy
            lastModifiedAt
        }
        actorsPaged(first: $first) {
            edges {
                cursor
                node {
                    id
                    role
                    vocal {
                        id
                        label
                    }
                    createdBy
                    createdAt
                    lastModifiedBy
                    lastModifiedAt
                }
            }
            pageInfo {
                hasPreviousPage
                hasNextPage
                startCursor
                endCursor
            }
        }
        actors {
            id
            role
            vocal {
                id
                label
            }
            createdBy
            createdAt
            lastModifiedBy
            lastModifiedAt
        }
        createdBy
        createdAt
        lastModifiedBy
        lastModifiedAt
    }
}
