mutation spexActivityUpdate ($spexareId: ID!, $activityId: ID!, $spexId: ID!, $id: ID!) {
    spexActivityUpdate(spexareId: $spexareId, activityId: $activityId, spexId: $spexId, id: $id) {
        id
        spex {
            id
            year
            title
            revival
            parent {
                id
                year
                createdBy
                createdAt
                lastModifiedBy
                lastModifiedAt
            }
            posterUrl
            category {
                id
                name
                firstYear
                logoUrl
                createdBy
                createdAt
                lastModifiedBy
                lastModifiedAt
            }
            revivals {
                id
                year
                createdBy
                createdAt
                lastModifiedBy
                lastModifiedAt
            }
        }
        createdBy
        createdAt
        lastModifiedBy
        lastModifiedAt
    }
}
