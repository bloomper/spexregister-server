query spexActivityByActivity ($spexareId: ID!, $activityId: ID!, $first: Int = 10) {
    spexActivityByActivity (spexareId: $spexareId, activityId: $activityId) {
        id
        spex {
            id
            year
            title
            revival
            parent {
                id
                year
                createdBy
                createdAt
                lastModifiedBy
                lastModifiedAt
            }
            posterUrl
            category {
                id
                name
                firstYear
                logoUrl
                createdBy
                createdAt
                lastModifiedBy
                lastModifiedAt
            }
            revivals {
                id
                year
                createdBy
                createdAt
                lastModifiedBy
                lastModifiedAt
            }
            revivalsPaged (first: $first) {
                edges {
                    cursor
                    node {
                        id
                        year
                        createdBy
                        createdAt
                        lastModifiedBy
                        lastModifiedAt
                    }
                }
                pageInfo {
                    hasPreviousPage
                    hasNextPage
                    startCursor
                    endCursor
                }
            }
        }
        createdBy
        createdAt
        lastModifiedBy
        lastModifiedAt
    }
}
