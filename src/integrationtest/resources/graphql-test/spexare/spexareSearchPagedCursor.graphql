query spexareSearchPagedCursor ($q: String!, $first: Int, $after: String, $last: Int, $before: String) {
    spexareSearchPaged (q: $q, first: $first, after: $after, last: $last, before: $before) {
        edges {
            cursor
            node {
                id
                firstName
                lastName
            }
        }
        pageInfo {
            hasPreviousPage
            hasNextPage
            startCursor
            endCursor
        }
        totalCount
    }
}
