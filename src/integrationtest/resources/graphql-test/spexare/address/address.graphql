query address ($spexareId: ID!, $id: ID!) {
    address (spexareId: $spexareId, id: $id) {
        id
        streetAddress
        postalCode
        city
        country
        phone
        phoneMobile
        emailAddress
        type {
            id
            label
            type
        }
        createdBy
        createdAt
        lastModifiedBy
        lastModifiedAt
    }
}
