mutation addressCreate ($spexareId: ID!, $typeId: ID!, $streetAddress: String, $postalCode: String, $city: String, $country: CountryCode, $phone: String, $phoneMobile: String, $emailAddress: Email) {
    addressCreate(spexareId: $spexareId, typeId: $typeId, input: { streetAddress: $streetAddress, postalCode: $postalCode, city: $city, country: $country, phone: $phone, phoneMobile: $phoneMobile, emailAddress: $emailAddress }) {
        id
        streetAddress
        postalCode
        city
        country
        phone
        phoneMobile
        emailAddress
        createdBy
        createdAt
        lastModifiedBy
        lastModifiedAt
    }
}
