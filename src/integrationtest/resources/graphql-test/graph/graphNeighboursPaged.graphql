query graphNeighboursPaged ($type: GraphNodeType!, $id: ID!, $edge: GraphEdgeType!, $first: Int, $after: String, $last: Int, $before: String) {
    graphNeighboursPaged (type: $type, id: $id, edge: $edge, first: $first, after: $after, last: $last, before: $before) {
        edges { cursor node { id type label sublabel imageUrl revival entityId } }
        pageInfo { hasPreviousPage hasNextPage startCursor endCursor }
        totalCount
    }
}
