query revisionDetail ($revision: Long!, $limitPerType: Int! = 20) {
    revisionDetail (revision: $revision, limitPerType: $limitPerType) {
        revision
        modifiedAt
        modifiedBy
        source
        operation
        comment
        summary {
            type
            count
            returned
        }
        entities {
            type
            entityId
            entityLabel
            revisionType
            changes {
                field
                oldValue
                newValue
                binary
            }
            target {
                type
                id
                label
            }
        }
    }
}
