spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  jpa:
    properties:
      hibernate:
        search:
          backend:
            directory:
              root: ./test-data/index_data
          indexing:
            plan:
              synchronization:
                strategy: sync

logging:
  file:
    path: ./test-data/log_data
