buildscript {
    dependencies {
        classpath('com.google.cloud.tools:jib-layer-filter-extension-gradle:0.3.0')
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '3.3.2'
    id 'org.sonarqube' version '6.0.1.5171'
    //id 'org.graalvm.buildtools.native' version '0.10.3'
    id 'jacoco'
    id "com.google.cloud.tools.jib" version "3.4.4"
}

group = 'nu.fgv.register'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    integrationTest {
        java {
            compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
            runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
            srcDir file('src/integrationtest/java')
        }
        resources.srcDir file('src/integrationtest/resources')
        resources.srcDir file('src/main/resources')
    }
    keycloak {
        java {
            compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
            runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
            srcDir file('src/keycloak/java')
        }
        resources.srcDir file('src/keycloak/resources')
    }
}

configurations {
    compileOnly.extendsFrom annotationProcessor
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    keycloakImplementation.extendsFrom developmentOnly
    keycloakRuntimeOnly.extendsFrom runtimeOnly
    asciidoctorExtensions
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file('build/generated-snippets'))
    set('keycloakProvidersDir', file('build/keycloak-providers'))
}

dependencies {
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.keycloak:keycloak-core:26.1.0'
    developmentOnly 'org.keycloak:keycloak-server-spi:26.1.0'
    developmentOnly 'org.keycloak:keycloak-server-spi-private:26.1.0'

    asciidoctorExtensions 'org.springframework.restdocs:spring-restdocs-asciidoctor'

    compileOnly 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.data:spring-data-rest-hal-explorer'
    implementation 'org.springframework.security:spring-security-acl'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation('net.sf.jmimemagic:jmimemagic:0.1.5') {
        ['commons-logging', 'log4j'].each {
            exclude group: it
        }
    }
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation 'org.apache.poi:poi:5.4.0'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'io.hypersistence:hypersistence-utils-hibernate-60:3.9.0'
    implementation 'com.google.guava:guava:33.4.0-jre'
    implementation 'org.keycloak:keycloak-admin-client:26.0.4'
    implementation 'org.passay:passay:1.6.6'
    implementation 'org.hibernate.search:hibernate-search-mapper-orm'
    implementation 'org.hibernate.search:hibernate-search-backend-lucene'
    //implementation 'org.hibernate.search:hibernate-search-backend-elasticsearch'
    implementation 'org.apache.lucene:lucene-backward-codecs:9.11.1'
    implementation 'net.datafaker:datafaker:2.4.2'
    implementation 'com.graphql-java:graphql-java-extended-scalars:21.0'
    implementation 'io.micrometer:context-propagation:1.1.2'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'org.hibernate.orm:hibernate-jpamodelgen'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.graphql:spring-graphql-test'

    integrationTestImplementation 'io.rest-assured:rest-assured:5.5.0'
    integrationTestImplementation 'io.rest-assured:rest-assured-all:5.5.0'
    integrationTestImplementation 'io.github.dvgaba:easy-random-randomizers:7.1.0'
    integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    //integrationTestImplementation 'org.opensearch:opensearch-testcontainers:2.1.2'
    integrationTestImplementation 'org.testcontainers:junit-jupiter'
    integrationTestImplementation 'org.testcontainers:mysql'
    integrationTestImplementation 'com.github.dasniko:testcontainers-keycloak:3.6.0'

    runtimeOnly 'com.mysql:mysql-connector-j'
    if (System.getProperty("os.name").toLowerCase().contains("mac") && System.getProperty("os.arch").toLowerCase().contains("aarch64")) {
       runtimeOnly 'io.netty:netty-resolver-dns-native-macos:4.1.117.Final:osx-aarch_64'
    }

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (System.getProperty("os.name").toLowerCase().contains("mac") && System.getProperty("os.arch").toLowerCase().contains("aarch64")) {
        testRuntimeOnly 'io.netty:netty-resolver-dns-native-macos:4.1.117.Final:osx-aarch_64'
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.testcontainers:testcontainers-bom:1.20.4'
        mavenBom 'org.hibernate.search:hibernate-search-bom:7.2.2.Final'
    }
}

javadoc {
    source = sourceSets.main.allJava
    destinationDir = layout.buildDirectory.dir('docs/javadoc').get().asFile
    title = 'Spexregister Server JavaDoc'
    classpath = sourceSets.main.compileClasspath + sourceSets.main.runtimeClasspath
    options {
        encoding 'UTF-8'
        charSet 'UTF-8'
        author true
        version true
        failOnError true
        verbose false
    }
}

tasks.register('createSnippetsDir') {
    doLast {
        project.mkdir snippetsDir
    }
}

tasks.register('createKeycloakProvidersDir') {
    doLast {
        project.mkdir keycloakProvidersDir
    }
}

tasks.named('test') {
    outputs.dir snippetsDir
    useJUnitPlatform()
    dependsOn createSnippetsDir
}

tasks.register('integrationTest', Test) {
    description = 'Runs the integration tests'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
}

integrationTest {
    useJUnitPlatform()
}

rootProject.tasks.named("processIntegrationTestResources") {
    duplicatesStrategy = 'include'
}

jacocoTestReport {
    dependsOn test, integrationTest
    reports {
        xml.required = true
    }
    additionalSourceDirs.from = files(sourceSets.main.allSource.srcDirs)
    sourceDirectories.from = files(sourceSets.main.allSource.srcDirs)
    classDirectories.from = files(sourceSets.main.output.classesDirs)
    executionData.from = fileTree(layout.buildDirectory).include(
            'jacoco/test.exec',
            'jacoco/integrationTest.exec'
    )
}

check.dependsOn jacocoTestReport

asciidoctor {
    dependsOn createSnippetsDir, test
    configurations 'asciidoctorExtensions'
    inputs.dir snippetsDir
    sourceDir 'src/main/asciidoc'
    attributes   \
        'snippets': file('build/generated-snippets'),
        'static-snippets': file('src/main/asciidoc/static-snippets')
}

rootProject.tasks.named("processKeycloakResources") {
    duplicatesStrategy = 'include'
}

tasks.register('keycloakJar', Jar) {
    archiveClassifier = 'keycloak'
    from sourceSets.keycloak.output
    dependsOn configurations.keycloakRuntimeClasspath
    destinationDirectory = file(keycloakProvidersDir)
}

assemble.dependsOn keycloakJar

bootJar {
    dependsOn asciidoctor, javadoc
    from("${asciidoctor.outputDir}") {
        into 'static/docs'
    }
    from("${javadoc.destinationDir}") {
        into 'static/docs/javadoc'
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'bloomper_spexregister-server'
        property 'sonar.organization', 'bloomper'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.exclusions', '**/**_.java'
    }
}

jib {
    from {
        image = 'eclipse-temurin:21-jre'
        platforms {
            platform {
                architecture = 'amd64'
                os = 'linux'
            }
            platform {
                architecture = 'arm64'
                os = 'linux'
            }
        }
    }
    to {
        image = "bloomper/${project.name}"
        tags = ['latest', "${version}"]
    }
    pluginExtensions {
        pluginExtension {
            implementation = 'com.google.cloud.tools.jib.gradle.extension.layerfilter.JibLayerFilterExtension'
            configuration {
                filters {
                    filter {
                        glob = '**/spring-boot-docker-compose-*.jar'
                    }
                }
            }
        }
    }
    extraDirectories {
        paths {
            path {
                from = "${asciidoctor.outputDir}"
                into = "/app/resources/static/docs"
            }
            path {
                from = "${javadoc.destinationDir}"
                into = "/app/resources/static/docs/javadoc"
            }
        }
    }
}

tasks.named('jib') {
    dependsOn asciidoctor, javadoc
}

jibDockerBuild {
    dependsOn asciidoctor
}
